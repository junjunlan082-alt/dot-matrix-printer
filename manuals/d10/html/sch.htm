<h1 class="head-a">搜索提示</h1>

<div class="body-text">键入几个特定的关键词并单击搜索按钮，可获得相关的结果列表。<br>确保使用空格来分隔关键词。</div>

<div class="body-text">搜索结果中与关键词匹配的内容用高亮红色显示。</div>

<div class="body-text">如果关键词以短语出现并多于一个，仅第一个为高亮显示。</div>

<div class="body-text">要进行精确或更小范围的搜索，添加更多的词进行搜索项目。</div>
