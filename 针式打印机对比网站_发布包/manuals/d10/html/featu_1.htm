<h1 class="head-a">
<a name="S-00200-00100"></a>性能</h1>

      <div class="body-text">EPSON<sup>&reg;</sup> LQ-520K 24-针针式打印机提供高质量的打印输出，且设计紧凑、性能优越。其功能如下：</div>
      <div id="itemiz">
        <div class="bullet">可处理多种类型的打印纸，包括连续纸、多联表格（1份原件和多达3份拷本）、单页纸、信封和和卷纸。</div>

<div class="bullet">在10cpi（每英寸字符数）下，高速打印时可达347 cps（每秒字符数）。</div>
</div>

<div class="body-text">打印机附带有打印机驱动程序和其他软件，包括对于<sup></sup> Windows 7, Vista<sup></sup>, XP和2000的 EPSON Status Monitor 3 。EPSON Status Monitor 3 应用工具可让您快速容易地检查打印机的状态。</div>
