<P><H1><B><!-- Head A -->
<A NAME="ge3<pv= a"></A>清除夹纸
</B></H1>


<P><BLOCKQUOTE><FONT SIZE=3>
</FONT></BLOCKQUOTE>


<P><!-- Body Text -->
按照下列步骤清除夹纸：
</P>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step -->
<IMG SRC="images/r_1.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 关闭打印机。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_2.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 打开打印机盖。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_3.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 如果连续纸夹在打印机中，在打印机后部撕下刚刚进入的打印纸。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_4.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 打开打印机右边的旋钮以清除夹纸。清除所有残留的纸片。
</TD></TR></TABLE>

<P><BLOCKQUOTE><!-- Indent -->
如果纸张粘在打印机退纸的地方，轻轻地将打印纸拉出打印机。
</BLOCKQUOTE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="0"><TR VALIGN="TOP"><TD><IMG SRC="images/r_space.gif" HEIGHT="5" WIDTH="40"></TD><TD><IMG SRC="images/r_caut.gif" BORDER="0" HSPACE=5 ></TD><TD><B><FONT COLOR="#FF0000"><!-- Caution H Ind -->
注意：
</FONT></B></TD></TR></TABLE>

<TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="0"><TR VALIGN="TOP"><TD><IMG SRC="images/r_space.gif" HEIGHT="5" WIDTH="40"></TD><TD><IMG SRC="images/r_space.gif" HEIGHT="5" WIDTH="40"></TD><TD><FONT COLOR="#000000"><!-- C/W T Ind -->
只有当关闭打印机时才可以使用打印机右边的旋钮清除夹纸。否则，会损坏打印机、改变页顶打印位置或切纸位置。
</FONT></TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_5.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 关闭打印机盖并打开打印机。确认<B><B>缺纸</B></B>和<B><B>暂停</B></B>灯熄灭。
</TD></TR></TABLE>
