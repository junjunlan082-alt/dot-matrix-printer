<P><H1><B><!-- Head A -->
<A NAME="tkjd4rs!;z a"></A>运输打印机
</B></H1>


<P><BLOCKQUOTE><FONT SIZE=3>
</FONT></BLOCKQUOTE>


<P><!-- Body Text -->
如果需要把打印机运到一定距离之外，请小心地将其用原包装箱和包装材料将打印机装好。 
</P>

<P><!-- Body Text -->
按照下列步骤将打印机用原包装箱和包装材料装好：
</P>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="0"><TR VALIGN="TOP"><TD><IMG SRC="images/r_warn.gif" BORDER="0" HSPACE=5 ></TD><TD><B><FONT COLOR="#FF0000"><!-- Warning Head -->
警告：
</FONT></B></TD></TR></TABLE>

<TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="0"><TR VALIGN="TOP"><TD><IMG SRC="images/r_space.gif" HEIGHT="5" WIDTH="40"></TD><TD><FONT COLOR="#000000"><!-- C/W Text -->
如果打印机刚刚使用过，打印头会很烫；冷却几分钟后再去触摸它。
</FONT></TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step -->
<IMG SRC="images/r_1.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 关闭打印机并取下装入打印机中的打印纸。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_2.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 将电源线从插座中拔出，然后断开打印机的接口电缆。如果安装了单页纸进纸器选件，则将其取下。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_3.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 卸下导纸器。按照 <A HREF="opt_1.htm#8;;i4x:p b">更换色带架</A>中步骤3和步骤4中的描述取下导纸器。然后关闭打印机盖。
</TD></TR></TABLE>

<P><TABLE BORDER=0 VSPACE="0" HSPACE="0" CELLSPACING="0" CELLPADDING="5"><TR VALIGN="TOP"><TD><!-- Step Next -->
<IMG SRC="images/r_4.gif" BORDER=0 HSPACE=0 VSPACE=0></TD><TD>
 把打印机、色带架、导纸器和电源线重新用原包装材料包装并放入打印机的原始包装盒中。
</TD></TR></TABLE>

<P><!-- Body Text -->

</P>
